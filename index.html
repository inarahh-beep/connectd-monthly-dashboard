<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Connectd — Social Media Dashboard</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f0f12;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;}
  .wrap{text-align:center;opacity:0;animation:fade .4s .1s forwards;}
  @keyframes fade{to{opacity:1}}
  .logo{font-size:32px;margin-bottom:12px;}
  p{font-size:13px;color:rgba(255,255,255,.5);}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">📊</div>
  <p>Loading latest dashboard…</p>
</div>
<script>
fetch('months.json')
  .then(r=>r.json())
  .then(months=>{
    const latest = months[0] && months[0].url;
    if(latest) window.location.replace(latest);
  })
  .catch(()=>{ window.location.replace('2026-06.html'); });
</script>
</body>
</html>
